name: Deploy Triad Homes and Living
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configure primary domain after DNS delegation
        run: node scripts/configure-primary-domain.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Check Move Plan access and delivery workflow
        run: node --test move-plan-app/workflow.test.mjs
      - name: Build static HTML for the actual Pages URL
        run: npm run build
        env:
          SITE_ORIGIN: https://triadhomesandliving.com
          CUSTOM_DOMAIN: triadhomesandliving.com
      - name: Check the generated site
        run: npm run verify
        env:
          SITE_ORIGIN: https://triadhomesandliving.com
      - name: Upload static website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
